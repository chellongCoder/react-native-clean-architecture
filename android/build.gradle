// Top-level build file where you can add configuration options common to all sub-projects/modules.

ext {
    compileSdkVersion = 35
    targetSdkVersion = 34
    minSdkVersion = 26
    buildToolsVersion = "35.0.0"
    kotlinVersion = "1.9.25"
    ndkVersion = "27.1.12297006"
}

buildscript {
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath('com.android.tools.build:gradle')
        classpath('com.facebook.react:react-native-gradle-plugin')
        classpath('org.jetbrains.kotlin:kotlin-gradle-plugin')
    }
}

apply plugin: "com.facebook.react.rootproject"

allprojects {
    ext {
        compileSdkVersion = 35
        targetSdkVersion = 34
        minSdkVersion = 26
        buildToolsVersion = "35.0.0"
        kotlinVersion = "1.9.25"
        ndkVersion = "27.1.12297006"
    }

    // Force NDK version and 16KB page size for all subprojects that have the 'android' extension
    project.plugins.withType(com.android.build.gradle.BasePlugin) {
        project.android {
            ndkVersion = "27.1.12297006"
            defaultConfig {
                externalNativeBuild {
                    cmake {
                        // Pass linker flags to CMake correctly
                        arguments "-DCMAKE_SHARED_LINKER_FLAGS=-Wl,-z,common-page-size=16384 -Wl,-z,max-page-size=16384",
                                  "-DCMAKE_EXE_LINKER_FLAGS=-Wl,-z,common-page-size=16384 -Wl,-z,max-page-size=16384"
                    }
                    ndkBuild {
                        // Pass to ndk-build via APP_LDFLAGS
                        arguments "APP_LDFLAGS+=-Wl,-z,common-page-size=16384 -Wl,-z,max-page-size=16384"
                    }
                }
            }
        }
    }

    repositories {
        maven {
            // All of React Native (JS, Obj-C sources, Android binaries) is installed from npm
            url(new File(['node', '--print', "require.resolve('react-native/package.json')"].execute(null, rootDir).text.trim(), '../android'))
        }
        maven {
            // Android JSC is installed from npm
            url(new File(['node', '--print', "require.resolve('jsc-android/package.json', { paths: [require.resolve('react-native/package.json')] })"].execute(null, rootDir).text.trim(), '../dist'))
        }

        google()
        mavenCentral()
        maven { url 'https://www.jitpack.io' }
    }
}
